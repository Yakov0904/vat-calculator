name: Keep Streamlit App Alive

on:
  schedule:
    # Запуск в 07:00 и 19:00 UTC (10:00 и 22:00 по Москве)
    - cron: '0 7,19 * * *'
  workflow_dispatch:

jobs:
  ping-app:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Run Headless Browser Ping
        run: |
          node -e '
          const { chromium } = require("playwright");
          (async () => {
            console.log("Запускаем браузер...");
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            
            console.log("Открываем приложение...");
            await page.goto("https://vat-calculator-mgt.streamlit.app/", { waitUntil: "networkidle", timeout: 60000 });

            // Проверяем, есть ли кнопка буждения (если сайт заснул)
            const wakeButton = page.locator("button:has-text(\"Wake it up\"), button:has-text(\"Yes, wake it up\")");
            if (await wakeButton.isVisible({ timeout: 5000 }).catch(() => false)) {
              console.log("Приложение спало. Нажимаем кнопку Wake it up...");
              await wakeButton.click();
              await page.waitForTimeout(15000); // Ждём, пока сервер поднимется
            } else {
              console.log("Приложение уже работает!");
            }

            await page.waitForTimeout(5000);
            await browser.close();
            console.log("Пинг через браузер успешно завершён!");
          })();
          '
